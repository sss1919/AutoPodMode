name: Build AutoPodMode (Rootless + RootHide)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  THEOS: ${{ github.workspace }}/theos
  THEOS_PACKAGE_SCHEME: rootless
  ARCHS: arm64e
  TARGET: iphone:clang:17.0:15.0
  DEB_REDIST: ${{ github.workspace }}/redist

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  build-roothide:
    runs-on: macos-13
    name: Build Rootless-RootHide deb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup macOS environment
        run: |
          brew install ldid make dpkg fakeroot xz coreutils
          echo "export PATH=\"$(brew --prefix make)/libexec/gnubin:$PATH\"" >> $GITHUB_ENV
          echo "export PATH=\"$(brew --prefix coreutils)/libexec/gnubin:$PATH\"" >> $GITHUB_ENV
          uname -a

      - name: Cache Theos + RootHide SDK
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.THEOS }}
            ${{ github.workspace }}/sdks
            ~/Library/Developer/theos
          key: ${{ runner.os }}-theos-roothide-v1-${{ hashFiles('Makefile') }}
          restore-keys: |
            ${{ runner.os }}-theos-roothide-v1-

      - name: Install Theos (roothide fork)
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          # Use roothide-dev/Theos for rootless-roothide packaging scheme support
          git clone --recursive --depth 1 https://github.com/roothide-dev/theos.git "${THEOS}"

          # Clone SDKs into theos/sdks (iPhoneOS17.0 SDK required for TARGET)
          mkdir -p "${THEOS}/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks || true
          # Copy iPhoneOS SDKs
          for sdk in /tmp/sdks/iPhoneOS*.sdk; do
            if [ -d "$sdk" ]; then
              cp -R "$sdk" "${THEOS}/sdks/"
              echo "Copied $(basename $sdk)"
            fi
          done

          # Apply roothide packaging scheme bootstrap
          if [ -f "${THEOS}/bin/bootstrap.sh" ]; then
            bash "${THEOS}/bin/bootstrap.sh" || true
          fi

          echo "Installed Theos fork + SDKs"

      - name: Verify Theos + SDKs
        run: |
          ls -la "${THEOS}"
          ls -la "${THEOS}/sdks" || true
          [ -d "${THEOS}/sdks/iPhoneOS17.0.sdk" ] && echo "iPhoneOS17.0.sdk OK"
          [ -d "${THEOS}/sdks/iPhoneOS16.5.sdk" ] && echo "iPhoneOS16.5.sdk OK"

      - name: Build package (rootless + roothide)
        id: build
        working-directory: ${{ github.workspace }}
        run: |
          export PATH="${THEOS}/bin:$(brew --prefix make)/libexec/gnubin:$PATH"
          export THEOS="${THEOS}"
          export THEOS_PACKAGE_SCHEME=rootless
          export THEOS_PACKAGE_SCHEME_ALT=roothide

          echo "=== Build env ==="
          echo "ARCHS=${ARCHS}"
          echo "TARGET=${TARGET}"
          echo "THEOS_PACKAGE_SCHEME=${THEOS_PACKAGE_SCHEME}"

          make clean
          make package FINALPACKAGE=1 STRIP=1 2>&1 | tee build.log

          # Collect artifacts
          mkdir -p "${DEB_REDIST}"
          shopt -s nullglob
          DEBS=(${GITHUB_WORKSPACE}/packages/*.deb)
          if [ "${#DEBS[@]}" -gt 0 ]; then
            for deb in "${DEBS[@]}"; do
              bn=$(basename "$deb")
              # Mark filename with rootless-roothide tag
              newname="${bn%.deb}__rootless-roothide.deb"
              cp -v "$deb" "${DEB_REDIST}/${newname}"
            done
          else
            echo "::warning::Expected .deb packages not found in packages/ folder"
          fi
          ls -la "${DEB_REDIST}" 2>/dev/null || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoPodMode-rootless-roothide-deb
          path: |
            ${{ env.DEB_REDIST }}/*.deb
            build.log
          retention-days: 90
          if-no-files-found: warn

      - name: Create Release tag + upload deb
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Auto build ${{ github.run_number }}
          generate_release_notes: true
          draft: false
          prerelease: true
          files: |
            ${{ env.DEB_REDIST }}/*.deb
            build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
