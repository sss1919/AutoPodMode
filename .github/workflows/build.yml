name: Build AutoPodMode (Rootless)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  THEOS: ${{ github.workspace }}/theos
  THEOS_PACKAGE_SCHEME: rootless
  ARCHS: arm64e
  TARGET: iphone:clang:16.5:15.0
  DEB_REDIST: ${{ github.workspace }}/redist

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  build:
    runs-on: macos-13
    name: Build Rootless deb (arm64e)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install macOS build dependencies
        run: |
          brew install ldid dpkg fakeroot make coreutils
          echo "PATH=$(brew --prefix make)/libexec/gnubin:$(brew --prefix coreutils)/libexec/gnubin:$PATH" >> $GITHUB_ENV
          uname -a
          xcodebuild -version 2>/dev/null || true

      - name: Cache Theos + SDKs
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.THEOS }}
          key: ${{ runner.os }}-theos-v5-${{ hashFiles('Makefile') }}
          restore-keys: |
            ${{ runner.os }}-theos-v5-

      - name: Install Theos + SDKs
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          git clone --recursive https://github.com/theos/theos.git "${THEOS}"
          echo "Cloned theos/theos"

          # Clone SDKs
          mkdir -p "${THEOS}/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          for sdk in /tmp/sdks/iPhoneOS*.sdk; do
            if [ -d "$sdk" ]; then
              cp -R "$sdk" "${THEOS}/sdks/"
              echo "Copied $(basename $sdk)"
            fi
          done
          echo "SDKs installed:"
          ls -la "${THEOS}/sdks/"

      - name: Verify Theos + SDKs
        run: |
          echo "=== SDKs ==="
          ls -la "${THEOS}/sdks"
          if [ ! -d "${THEOS}/sdks/iPhoneOS16.5.sdk" ]; then
            echo "::error::iPhoneOS16.5.sdk not found!"
            ls "${THEOS}/sdks/"
            exit 1
          fi
          echo "iPhoneOS16.5.sdk OK"

      - name: Build package (rootless)
        id: build
        working-directory: ${{ github.workspace }}
        run: |
          export PATH="$(brew --prefix make)/libexec/gnubin:$(brew --prefix coreutils)/libexec/gnubin:${THEOS}/bin:$PATH"
          export THEOS="${THEOS}"
          export THEOS_PACKAGE_SCHEME=rootless

          echo "=== Build env ==="
          echo "ARCHS=${ARCHS}"
          echo "TARGET=${TARGET}"
          echo "THEOS_PACKAGE_SCHEME=${THEOS_PACKAGE_SCHEME}"

          make clean 2>&1 | tail -5
          echo "=== Starting package build ==="
          make package FINALPACKAGE=1 STRIP=1 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "Build exit code: $BUILD_EXIT"

          if [ $BUILD_EXIT -ne 0 ]; then
            echo "::error::Build failed with exit code $BUILD_EXIT"
            exit 1
          fi

          # Collect artifacts
          mkdir -p "${DEB_REDIST}"
          shopt -s nullglob
          DEBS=(${GITHUB_WORKSPACE}/packages/*.deb)
          if [ "${#DEBS[@]}" -gt 0 ]; then
            for deb in "${DEBS[@]}"; do
              bn=$(basename "$deb")
              newname="${bn%.deb}_rootless_arm64e.deb"
              cp -v "$deb" "${DEB_REDIST}/${newname}"
            done
          else
            echo "::warning::No .deb packages found"
            find . -name "*.deb" -ls
          fi
          echo "=== Artifacts ==="
          ls -la "${DEB_REDIST}"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AutoPodMode-rootless-deb
          path: |
            ${{ env.DEB_REDIST }}/*.deb
            build.log
          retention-days: 90
          if-no-files-found: warn

      - name: Create Release + upload deb
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/') && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: AutoPodMode v1.0.0 (Build ${{ github.run_number }})
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            ${{ env.DEB_REDIST }}/*.deb
            build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
