name: Build AutoPodMode (Rootless)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  THEOS: ${{ github.workspace }}/theos
  THEOS_PACKAGE_SCHEME: rootless
  ARCHS: arm64e
  TARGET: iphone:clang:16.5:15.0
  DEB_REDIST: ${{ github.workspace }}/redist

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Rootless deb (arm64e)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential fakeroot rsync curl perl zip git \
            libxml2 libncurses-dev xz-utils ca-certificates \
            dpkg-dev libssl-dev zlib1g-dev libplist-dev
          # Build ldid from source (not in Ubuntu repos)
          git clone --depth 1 https://github.com/ProcursusTeam/ldid.git /tmp/ldid
          cd /tmp/ldid && make -j$(nproc) && sudo cp ldid /usr/local/bin/ && sudo chmod +x /usr/local/bin/ldid
          # Adjust fakeroot to favor sysv
          sudo update-alternatives --set fakeroot /usr/bin/fakeroot-sysv 2>/dev/null || true
          echo "Dependencies installed"
          uname -a

      - name: Cache Theos + toolchain + SDKs
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.THEOS }}
          key: ubuntu-theos-v9-${{ hashFiles('Makefile') }}
          restore-keys: |
            ubuntu-theos-v9-

      - name: Install Theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          rm -rf "${THEOS}"
          git clone --recursive https://github.com/theos/theos.git "${THEOS}"
          echo "Cloned theos/theos"

          # Download iOS toolchain (from L1ghtmann/llvm-project)
          echo "Downloading iOS toolchain..."
          ARCH=$(uname -m)
          mkdir -p "${THEOS}/toolchain"
          curl -fsSL "https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-${ARCH}.tar.xz" \
            | tar -xJvf - -C "${THEOS}/toolchain/"
          echo "Toolchain installed:"
          ls -la "${THEOS}/toolchain/linux/iphone/bin/" 2>/dev/null || ls -R "${THEOS}/toolchain/" | head -30

          # Clone SDKs
          mkdir -p "${THEOS}/sdks"
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          for sdk in /tmp/sdks/iPhoneOS*.sdk; do
            if [ -d "$sdk" ]; then
              cp -R "$sdk" "${THEOS}/sdks/"
              echo "Copied $(basename $sdk)"
            fi
          done
          echo "SDKs installed:"
          ls -la "${THEOS}/sdks/"

      - name: Verify Theos + SDKs + toolchain
        run: |
          echo "=== SDKs ==="
          ls "${THEOS}/sdks"
          echo "=== Toolchain ==="
          ls "${THEOS}/toolchain/linux/iphone/bin/" 2>/dev/null || { echo "Toolchain not found!"; find "${THEOS}/toolchain" -name "clang" -type f; }
          if [ ! -d "${THEOS}/sdks/iPhoneOS16.5.sdk" ]; then
            echo "::error::iPhoneOS16.5.sdk not found!"
            exit 1
          fi
          echo "All verified OK"

      - name: Build package (rootless)
        id: build
        working-directory: ${{ github.workspace }}
        run: |
          export PATH="${THEOS}/bin:$PATH"
          export THEOS="${THEOS}"
          export THEOS_PACKAGE_SCHEME=rootless

          echo "=== Build env ==="
          echo "ARCHS=${ARCHS}"
          echo "TARGET=${TARGET}"
          echo "THEOS_PACKAGE_SCHEME=${THEOS_PACKAGE_SCHEME}"

          make clean 2>&1 | tail -5
          echo "=== Starting package build ==="
          make package FINALPACKAGE=1 STRIP=1 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "Build exit code: $BUILD_EXIT"

          if [ $BUILD_EXIT -ne 0 ]; then
            echo "::error::Build failed with exit code $BUILD_EXIT"
            exit 1
          fi

      - name: Verify & fix rootless structure
        id: verify-fix
        run: |
          mkdir -p "${DEB_REDIST}"
          DEBS=$(find "${GITHUB_WORKSPACE}/packages" -maxdepth 1 -name "*.deb" 2>/dev/null)
          if [ -z "$DEBS" ]; then
            echo "::warning::No .deb packages found"
            find . -name "*.deb" -ls
            exit 0
          fi

          for deb in $DEBS; do
            bn=$(basename "$deb")
            tmpdir=$(mktemp -d)

            cd "$tmpdir"
            ar x "$deb"

            echo "=== ar contents of $bn ==="
            ls -la

            # Find data archive (could be .gz, .xz, .zst, .lzma, or uncompressed)
            DATA_ARCHIVE=""
            for ext in gz xz zst lzma; do
              if [ -f "data.tar.${ext}" ]; then
                DATA_ARCHIVE="data.tar.${ext}"
                break
              fi
            done
            if [ -z "$DATA_ARCHIVE" ] && [ -f "data.tar" ]; then
              DATA_ARCHIVE="data.tar"
            fi

            if [ -z "$DATA_ARCHIVE" ]; then
              echo "::error::No data archive found in $bn"
              cd /
              rm -rf "$tmpdir"
              continue
            fi
            echo "Data archive: $DATA_ARCHIVE"

            # Find control archive
            CONTROL_ARCHIVE=""
            for ext in gz xz zst lzma; do
              if [ -f "control.tar.${ext}" ]; then
                CONTROL_ARCHIVE="control.tar.${ext}"
                break
              fi
            done
            if [ -z "$CONTROL_ARCHIVE" ] && [ -f "control.tar" ]; then
              CONTROL_ARCHIVE="control.tar"
            fi
            echo "Control archive: $CONTROL_ARCHIVE"

            # Extract data archive
            mkdir -p data_extract
            cd data_extract
            case "$DATA_ARCHIVE" in
              *.gz)   tar xzf "../$DATA_ARCHIVE" ;;
              *.xz)   tar xJf "../$DATA_ARCHIVE" ;;
              *.zst)  tar --zstd -xf "../$DATA_ARCHIVE" 2>/dev/null || zstd -d "../$DATA_ARCHIVE" -c | tar xf - ;;
              *.lzma) tar --lzma -xf "../$DATA_ARCHIVE" 2>/dev/null || lzma -d "../$DATA_ARCHIVE" -c | tar xf - ;;
              *)      tar xf "../$DATA_ARCHIVE" ;;
            esac

            echo "=== File paths in $bn ==="
            find . -not -name '.' | head -40

            # Check if paths are rootless (under var/jb/)
            ROOTLESS_COUNT=$(find . -path "./var/jb/*" 2>/dev/null | wc -l)
            ROOTHIDE_COUNT=$(find . -not -path './var/*' -not -path './var' -not -path './var/jb/*' -not -path './var/jb' -not -name '.' 2>/dev/null | wc -l)

            echo "Rootless paths (var/jb): $ROOTLESS_COUNT"
            echo "Roothide paths (other): $ROOTHIDE_COUNT"

            NEEDS_FIX=0

            if [ "$ROOTLESS_COUNT" -gt 0 ] && [ "$ROOTHIDE_COUNT" -eq 0 ]; then
              echo "Paths already rootless"
            else
              echo "Converting paths to rootless..."
              NEEDS_FIX=1
              mkdir -p var/jb
              for dir in Library usr bin etc tmp; do
                if [ -d "$dir" ]; then
                  if [ -d "var/jb/$dir" ]; then
                    echo "  Merging $dir into var/jb/$dir"
                    cp -R "$dir"/* "var/jb/$dir/" 2>/dev/null || true
                    rm -rf "$dir"
                  else
                    echo "  Moving $dir -> var/jb/$dir"
                    mv "$dir" var/jb/
                  fi
                fi
              done
              echo "=== Fixed file paths ==="
              find . -not -name '.' | head -40
            fi

            # Repack data archive as .gz (remove old archive first)
            rm -f "$tmpdir/data.tar" "$tmpdir/data.tar.gz" "$tmpdir/data.tar.xz" "$tmpdir/data.tar.zst" 2>/dev/null
            cd "$tmpdir/data_extract"
            tar czf "$tmpdir/data.tar.gz" ./*
            cd "$tmpdir"

            # Extract and fix control file
            if [ -n "$CONTROL_ARCHIVE" ]; then
              mkdir -p control_extract
              cd control_extract
              case "$CONTROL_ARCHIVE" in
                *.gz)   tar xzf "$tmpdir/$CONTROL_ARCHIVE" ;;
                *.xz)   tar xJf "$tmpdir/$CONTROL_ARCHIVE" ;;
                *.zst)  tar --zstd -xf "$tmpdir/$CONTROL_ARCHIVE" 2>/dev/null || zstd -d "$tmpdir/$CONTROL_ARCHIVE" -c | tar xf - ;;
                *.lzma) tar --lzma -xf "$tmpdir/$CONTROL_ARCHIVE" 2>/dev/null || lzma -d "$tmpdir/$CONTROL_ARCHIVE" -c | tar xf - ;;
                *)      tar xf "$tmpdir/$CONTROL_ARCHIVE" ;;
              esac
              if [ -f "control" ]; then
                echo "=== Control file before ==="
                cat control
                if ! grep -q "^Architecture:.*arm64e" control; then
                  sed -i 's/^Architecture:.*/Architecture: iphoneos-arm64e/' control
                  echo "=== Control file after ==="
                  cat control
                else
                  echo "Architecture already arm64e"
                fi
              fi
              # Repack control as .gz (remove old archive first)
              rm -f "$tmpdir/control.tar" "$tmpdir/control.tar.gz" "$tmpdir/control.tar.xz" "$tmpdir/control.tar.zst" 2>/dev/null
              tar czf "$tmpdir/control.tar.gz" ./*
              cd "$tmpdir"
            fi

            # Rebuild deb with fixed data and control
            OUTPUT_DEB="${DEB_REDIST}/com.sss1919.autopodmode_1.0.1_iphoneos-arm64e.deb"
            rm -f "$OUTPUT_DEB"
            ar r "$OUTPUT_DEB" debian-binary control.tar.gz data.tar.gz
            echo "Final package: $OUTPUT_DEB"

            cd /
            rm -rf "$tmpdir"
          done

          echo "=== Final artifacts ==="
          ls -la "${DEB_REDIST}"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AutoPodMode-rootless-deb
          path: |
            ${{ env.DEB_REDIST }}/*.deb
            build.log
          retention-days: 90
          if-no-files-found: warn

      - name: Create Release + upload deb
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/') && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: AutoPodMode v1.0.0 (Build ${{ github.run_number }})
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            ${{ env.DEB_REDIST }}/*.deb
            build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}